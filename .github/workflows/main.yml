name: build app
on: 
  push:
    branches:
      - main
  workflow_dispatch: 
jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup Jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Setup SDK
        uses: android-actions/setup-android@v3
      - name: accept android sdk license
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true
      - name: give permission for gradlew
        run: chmod +x gradlew
      - name: build app
        run: ./gradlew assembleRelease :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble
      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: app/build/outputs/apk/release/*.apk
      
        
        
      
  
      
  
